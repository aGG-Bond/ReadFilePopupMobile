<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadFilePopupMobile 交互式 Playground</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #333;
      background: #f5f7fa;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      display: flex;
      height: calc(100vh - 80px);
    }

    .sidebar {
      width: 240px;
      background: white;
      border-right: 1px solid #e1e4e8;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar h3 {
      padding: 15px 20px 10px;
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.5px;
    }

    .example-item {
      padding: 12px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.2s;
      font-size: 14px;
    }

    .example-item:hover {
      background: #f6f8fa;
      border-left-color: #667eea;
    }

    .example-item.active {
      background: #f0f4ff;
      border-left-color: #667eea;
      color: #667eea;
      font-weight: 500;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: white;
      border-bottom: 1px solid #e1e4e8;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5a6fd6;
    }

    .btn-secondary {
      background: #f6f8fa;
      color: #333;
      border: 1px solid #e1e4e8;
    }

    .btn-secondary:hover {
      background: #e9ecef;
    }

    .editor-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1e4e8;
    }

    .panel-header {
      padding: 10px 15px;
      background: #f6f8fa;
      border-bottom: 1px solid #e1e4e8;
      font-size: 13px;
      font-weight: 500;
      color: #586069;
    }

    .editor {
      flex: 1;
      width: 100%;
      padding: 15px;
      border: none;
      resize: none;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      background: #fafbfc;
      color: #24292e;
      outline: none;
    }

    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .preview-frame {
      flex: 1;
      border: none;
      background: white;
    }

    .status-bar {
      padding: 8px 15px;
      background: #f6f8fa;
      border-top: 1px solid #e1e4e8;
      font-size: 12px;
      color: #666;
    }

    .status-bar.success {
      color: #28a745;
    }

    .status-bar.error {
      color: #dc3545;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        height: auto;
      }

      .sidebar {
        width: 100%;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid #e1e4e8;
      }

      .editor-container {
        flex-direction: column;
      }

      .editor-panel {
        border-right: none;
        border-bottom: 1px solid #e1e4e8;
        min-height: 300px;
      }

      .preview-panel {
        min-height: 400px;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>📱 ReadFilePopupMobile Playground</h1>
    <p>实时编辑代码，预览强制阅读弹窗效果</p>

    const editor = document.getElementById('codeEditor');
    const previewFrame = document.getElementById('previewFrame');
    const statusBar = document.getElementById('statusBar');
    const exampleList = document.getElementById('exampleList');

    let currentExampleIndex = 0;

    function renderExampleList() {
      exampleList.innerHTML = examples.map((ex, index) => 
        `<div class="example-item ${index === 0 ? 'active' : ''}" data-index="${index}">${ex.name}</div>`
      ).join('');

      exampleList.querySelectorAll('.example-item').forEach(item => {
        item.addEventListener('click', () => {
          const index = parseInt(item.dataset.index);
          loadExample(index);
        });
      });
    }

    function loadExample(index) {
      currentExampleIndex = index;
      editor.value = examples[index].code;
      
      exampleList.querySelectorAll('.example-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
      
      runCode();
    }

    function runCode() {
      var code = editor.value;
      var isFileListExample = code.indexOf('isDrawFileList: true') !== -1;

      var bodyContent = '';
      var scriptContent = '';

      if (isFileListExample) {
        bodyContent = '<div id="fileList"></div>';
        scriptContent = 'try {\n' + code + '\n} catch(e) {\n  console.error(e);\n  alert("代码执行错误: " + e.message);\n}';
      } else {
        bodyContent = '<button class="trigger-btn" id="triggerBtn">点击打开弹窗</button><p class="tip">点击按钮查看效果</p>';
        scriptContent = "document.getElementById('triggerBtn').addEventListener('click', function() {\n  try {\n    " + code + "\n  } catch(e) {\n    console.error(e);\n    alert('代码执行错误: ' + e.message);\n  }\n});\nsetTimeout(function() {\n  document.getElementById('triggerBtn').click();\n}, 300);";
      }

      var previewHtml = [
        '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">',
        '<style>',
        'body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; background: #f5f7fa; }',
        '.trigger-btn { padding: 15px 30px; font-size: 16px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); transition: all 0.3s; }',
        '.trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5); }',
        '.tip { margin-top: 20px; color: #666; font-size: 14px; }',
        '#fileList { width: 100%; max-width: 400px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }',
        '</style></head><body>',
        bodyContent,
        '<script type="module">import FilePreview from "/dist/ReadFilePopupMobile.es.js";' + scriptContent + '</scr' + 'ipt>',
        '</body></html>'
      ].join('');

      previewFrame.srcdoc = previewHtml;
      setStatus('运行成功', 'success');
    }

    function setStatus(text, type) {
      statusBar.textContent = text;
      statusBar.className = 'status-bar ' + (type || '');
    }

    document.getElementById('runBtn').addEventListener('click', runCode);

    document.getElementById('resetBtn').addEventListener('click', () => {
      loadExample(currentExampleIndex);
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(editor.value).then(() => {
        setStatus('代码已复制到剪贴板', 'success');
        setTimeout(() => setStatus('就绪'), 2000);
      });
    });

    editor.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        runCode();
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
      }
    });

    renderExampleList();
    loadExample(0);
  </script>
</body>
