<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadFilePopupMobile Canvas Demo</title>
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 24px; font-family: system-ui, sans-serif; color: #202124; }
    h1 { margin-top: 0; }
    .panel { padding: 20px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
    button { margin: 6px 8px 6px 0; padding: 10px 14px; border: 0; border-radius: 6px; color: #fff; background: #1769aa; cursor: pointer; }
    button.secondary { background: #5f6368; }
    button:hover { opacity: .88; }
    code { background: #f1f3f4; padding: 2px 5px; border-radius: 4px; }
    #status { min-height: 24px; color: #5f6368; }
  </style>
</head>
<body>
  <h1>Canvas PDF 渲染测试</h1>

  <div class="panel">
    <p>本页面使用本地构建产物和 <code>dist/pdf*.js</code>，不依赖 CDN。</p>
    <button id="canvas">强制使用 Canvas</button>
    <button id="auto">自动检测移动设备</button>
    <button id="iframe" class="secondary">使用 iframe</button>
    <p id="status">请选择一种预览模式。</p>
  </div>

  <script type="module">
    import FilePreview from "/dist/ReadFilePopupMobile.es.js";

    const pdfUrl = "https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf";
    // const localPdfJs = "/dist/pdf.min.mjs";
    // const localPdfWorker = "/dist/pdf.worker.min.mjs";
    const localPdfJs = "";
    const localPdfWorker = "";
    const status = document.querySelector("#status");

    function openPreview(mode) {
      const preview = new FilePreview({
        useCanvasRender: mode,
        // pdfJsPath: localPdfJs,
        // pdfWorkerPath: localPdfWorker
      });
      status.textContent = `当前模式：${mode === true ? "Canvas" : mode === "auto" ? "自动检测" : "iframe"}`;
      preview.judgeFileType({
        type: 2,
        file: { name: "PDF.js 测试文档", file_type: 2, pdf_url: pdfUrl, content_text: "" }
        }).catch((error) => {
          status.textContent = `加载失败：${error.message}`;
          console.error(error);
        });
    }

    document.querySelector("#canvas").addEventListener("click", () => openPreview(true));
    document.querySelector("#auto").addEventListener("click", () => openPreview("auto"));
    document.querySelector("#iframe").addEventListener("click", () => openPreview(false));
  </script>
</body>
</html>
